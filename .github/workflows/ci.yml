name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Unit + integration tests (local Spark + Iceberg)
        run: sbt -v test
      - name: Build the spark-submit jar
        run: sbt assembly
      - uses: actions/upload-artifact@v4
        with:
          name: deadlock-lakehouse-jar
          path: target/scala-2.12/deadlock-lakehouse.jar

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow and providers
        run: pip install "apache-airflow>=3.1,<3.5" apache-airflow-providers-apache-spark apache-airflow-providers-common-sql pytest
      - name: DAG integrity tests
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest -q airflow/tests
